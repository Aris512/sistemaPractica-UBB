# Nginx de producción: sirve el frontend compilado (dist/) y reenvía al backend las rutas que
# atiende Spring Boot. El backend no publica puertos; se alcanza por la red interna con el nombre
# del servicio "backend" definido en docker-compose.prod.yml.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Spring acepta peticiones multipart de hasta 25 MB (spring.servlet.multipart.max-request-size).
    client_max_body_size 25m;

    # Cabeceras comunes para todo lo que va al backend.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El chatbot espera a Groq hasta 60 s (GROQ_TIMEOUT_SEGUNDOS); se deja margen.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # API pública de la aplicación.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Página del panel de administración: es de React. Va como coincidencia exacta porque, sin ella,
    # Nginx redirige "/admin" a "/admin/" (regla de las location con proxy_pass y barra final) y la
    # página terminaría en el backend.
    location = /admin {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Datos del panel de administración (/admin/usuarios, /admin/documentos, /admin/permisos...).
    location /admin/ {
        proxy_pass http://backend:8080;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
    }

    # Archivos generados por Vite: llevan hash en el nombre, se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta (/, /admin, ...) devuelve index.html y React decide qué mostrar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
