spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/proyecto_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=proyecto_user
spring.datasource.password=proyecto_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de carga de archivos (Límite 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.storage.location=uploads

# Credenciales de administración básica (cargadas desde .env o variables de entorno)
admin.basic.username=${ADMIN_BASIC_USERNAME:admin}
admin.basic.password=${ADMIN_BASIC_PASSWORD:admin123}
