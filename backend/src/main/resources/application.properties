spring.application.name=backend

# Perfil por defecto: nadie tiene que activar dev manualmente.
spring.profiles.default=dev

# --- Datasource común (valores por defecto solo para desarrollo) ---
# Las credenciales vienen de variables de entorno / .env (ver .env.example).
# La contraseña NO tiene valor por defecto: si falta, la app no arranca.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyecto_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:proyecto_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

# --- Flyway: el esquema se crea/migra con scripts en db/migration ---
# baseline-on-migrate permite adoptar Flyway en bases que ya tenían tablas
# (Hibernate a las creó antes). En una base vacía se aplica V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Configuración de carga de archivos (Límite 20MB) ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.storage.location=uploads

# --- Credenciales de administración básica ---
# Deben configurarse en .env o variables de entorno del sistema.
# Sin estas variables el acceso a /admin queda BLOQUEADO completamente.
admin.basic.username=${ADMIN_BASIC_USERNAME:__NOT_SET__}
admin.basic.password=${ADMIN_BASIC_PASSWORD:__NOT_SET__}
