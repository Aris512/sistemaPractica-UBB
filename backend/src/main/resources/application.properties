spring.application.name=backend

# Conexión a MySQL. Los valores por defecto corresponden al MySQL local de docker-compose.yml (desarrollo);
# en producción se definen con variables de entorno (ver docker-compose.prod.yml y .env.example).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:proyecto_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:proyecto_user}
spring.datasource.password=${DB_PASSWORD:proyecto_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:true}

# Configuración de carga de archivos (Límite 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.storage.location=uploads

# Credenciales de administración básica (deben configurarse en .env o variables de entorno del sistema)
# Sin estas variables el acceso a /admin queda BLOQUEADO completamente
admin.basic.username=${ADMIN_BASIC_USERNAME:__NOT_SET__}
admin.basic.password=${ADMIN_BASIC_PASSWORD:__NOT_SET__}

# Chatbot de IA con Groq (API compatible con OpenAI). La clave se configura en .env o en las
# variables de entorno del sistema (GROQ_API_KEY); nunca en archivos versionados ni en el frontend.
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.timeout-segundos=${GROQ_TIMEOUT_SEGUNDOS:60}
groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:2048}

# Límites del chatbot
chat.max-caracteres-mensaje=4000
chat.max-mensajes-contexto=20
chat.max-caracteres-contexto=24000
chat.max-mensajes-por-conversacion=200
chat.max-conversaciones=100
chat.limite-mensajes-por-minuto=10
chat.limite-mensajes-por-dia=200
# Muestra el mensaje de las excepciones (ej. "No le corresponde esta pauta") en la respuesta de error
server.error.include-message=always
