spring.application.name=backend

# Conexión a MySQL. Los valores por defecto corresponden al MySQL local de docker-compose.yml (desarrollo);
# en producción se definen con variables de entorno (ver docker-compose.prod.yml y .env.example).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:proyecto_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:proyecto_user}
spring.datasource.password=${DB_PASSWORD:proyecto_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:true}

# Configuración de carga de archivos (Límite 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.storage.location=uploads

# Credenciales de administración básica (deben configurarse en .env o variables de entorno del sistema)
# Sin estas variables el acceso a /admin queda BLOQUEADO completamente
admin.basic.username=${ADMIN_BASIC_USERNAME:__NOT_SET__}
admin.basic.password=${ADMIN_BASIC_PASSWORD:__NOT_SET__}

# Chatbot de IA con Groq (API compatible con OpenAI). La clave se configura en .env o en las
# variables de entorno del sistema (GROQ_API_KEY); nunca en archivos versionados ni en el frontend.
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.timeout-segundos=${GROQ_TIMEOUT_SEGUNDOS:60}
groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:2048}

# Respaldo con Gemini (endpoint compatible con OpenAI): si Groq se satura (límite de uso, solicitud que supera sus
# tokens por minuto, caída o tiempo agotado) responde Gemini con los mismos mensajes y reglas. Sin GEMINI_API_KEY
# no hay respaldo. Gemini cuenta el razonamiento dentro de sus tokens de salida: por eso un máximo mayor.
ia.respaldo.habilitado=${IA_RESPALDO_HABILITADO:true}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.timeout-segundos=${GEMINI_TIMEOUT_SEGUNDOS:60}
gemini.max-completion-tokens=${GEMINI_MAX_COMPLETION_TOKENS:4096}
gemini.reasoning-effort=${GEMINI_REASONING_EFFORT:low}

# Límites del chatbot
chat.max-caracteres-mensaje=4000
chat.max-mensajes-contexto=20
chat.max-caracteres-contexto=24000
chat.max-mensajes-por-conversacion=200
chat.max-conversaciones=100
# Preguntas (mensajes del alumno) por conversación; en las de revisión, por cada versión del archivo
chat.max-preguntas-por-conversacion=5
chat.limite-mensajes-por-minuto=10
chat.limite-mensajes-por-dia=200

# RAG de planificaciones: el archivo «Planificación» se divide en fragmentos con embeddings (tabla
# fragmento_planificacion). A la IA llega el documento completo si cabe; si no, los fragmentos más relevantes.
ia.rag.habilitado=${IA_RAG_HABILITADO:true}
ia.rag.tamano-fragmento=900
ia.rag.solape=150
# Caracteres del archivo por mensaje: al revisar un archivo nuevo y en las preguntas siguientes
ia.rag.max-caracteres-revision=8000
ia.rag.max-caracteres-consulta=5000
# Máximo que se lee del archivo para indexarlo (antes la IA solo veía los primeros 8.000)
ia.rag.max-caracteres-indexar=60000
# Embeddings: "local" (por defecto, sin claves ni costo) o "remoto" (endpoint compatible con OpenAI; por defecto
# Gemini gemini-embedding-001 con la misma GEMINI_API_KEY). Al cambiar de proveedor los archivos se reindexan solos.
ia.embeddings.proveedor=${IA_EMBEDDINGS_PROVEEDOR:local}
ia.embeddings.url=${IA_EMBEDDINGS_URL:https://generativelanguage.googleapis.com/v1beta/openai/embeddings}
ia.embeddings.api-key=${IA_EMBEDDINGS_API_KEY:${GEMINI_API_KEY:}}
ia.embeddings.modelo=${IA_EMBEDDINGS_MODELO:gemini-embedding-001}
ia.embeddings.dimensiones=${IA_EMBEDDINGS_DIMENSIONES:768}

# Caché de respuestas de la IA (tabla ia_cache_respuesta): una solicitud idéntica, o una pregunta suelta muy
# parecida a otra ya respondida, se contesta sin llamar a la IA.
ia.cache.habilitada=${IA_CACHE_HABILITADA:true}
ia.cache.ttl-horas=168
# Similitud mínima (0 a 1) para reutilizar la respuesta de una pregunta parecida
ia.cache.similitud-minima=0.95
ia.cache.max-candidatas=300
